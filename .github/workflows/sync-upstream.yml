name: Sync fork with upstream

on:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00）自动同步上游
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork
        uses: repo-sync/github-sync@v2
        with:
          source_repo: https://github.com/yaojingang/GEOInflow.git
          source_branch: main
          destination_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
